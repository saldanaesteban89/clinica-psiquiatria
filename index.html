<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IC Psiquiatría</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4F0;--card:#FFF;--border:#E0DED6;--text:#1A1917;--text2:#6B6860;--text3:#9B9890;--green:#0F6E56;--green-bg:#E8F5E9;--blue:#1565C0;--blue-bg:#E3F2FD;--red:#C62828;--red-bg:#FFEBEE;--amber-bg:#FFF8E1;--amber-text:#6D4C00;--r:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;position:sticky;top:0;z-index:100}
.hdr{max-width:700px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--text);border-radius:7px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:16px;height:16px}
.logo-name{font-size:15px;font-weight:600}
.logo-sub{font-size:11px;color:var(--text2)}
.badge{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:500}
.badge-g{background:var(--green-bg);color:var(--green)}.badge-a{background:var(--amber-bg);color:var(--amber-text)}.badge-r{background:var(--red-bg);color:var(--red)}.badge-b{background:var(--blue-bg);color:var(--blue)}
.main{max-width:700px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card-h{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.card-b{padding:0 16px 14px}
.lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px}
textarea,input,select{width:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;outline:none;-webkit-appearance:none}
textarea:focus,input:focus,select:focus{border-color:#999;background:#fff}
textarea{resize:vertical;line-height:1.6}
.ta-voice{min-height:100px;max-height:250px;overflow-y:auto}
.ta-hist{min-height:280px;font-size:13px;font-family:'DM Mono',monospace;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--text);color:#fff;border-color:var(--text)}
.btn-rec{border-color:var(--red);color:var(--red);background:var(--red-bg);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st{font-size:12px;color:var(--text2);margin-top:6px;min-height:18px;line-height:1.5}
.st-ok{color:var(--green)}.st-err{color:var(--red)}.st-load{color:var(--blue)}
.pipe{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);padding:8px 0;flex-wrap:wrap}
.pd{width:7px;height:7px;border-radius:50%;background:var(--border)}
.pd-ok{background:var(--green)}.pd-on{background:var(--blue);animation:pulse 1s infinite}.pd-err{background:var(--red)}
.doc-link{display:block;padding:10px;background:var(--green-bg);color:var(--green);border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;text-align:center;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{display:flex;flex-direction:column;gap:4px}.fg.f{grid-column:1/-1}
label{font-size:11px;color:var(--text2);font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px}
.tab{font-family:'DM Sans',sans-serif;font-size:13px;padding:10px 14px;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.collapse{display:none}.collapse.open{display:block}
.arrow{font-size:10px;color:var(--text3);transition:transform .2s}
.open>.arrow{transform:rotate(180deg)}
.cfg-row{display:flex;gap:8px;margin-bottom:8px}
.cfg-row input{flex:1;font-size:12px;font-family:'DM Mono',monospace}
@media(max-width:500px){.grid{grid-template-columns:1fr}.fg.f{grid-column:1}}
</style>
</head>
<body>
<header><div class="hdr">
<div class="logo">
<div class="logo-icon"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="8" r="2.5" fill="#fff"/></svg></div>
<div><div class="logo-name">IC Psiquiatría</div><div class="logo-sub">Policlínico del Olaya</div></div>
</div>
<span class="badge badge-a" id="hdr-badge">Sin configurar</span>
</div></header>
<div class="main">
<div class="card"><div class="card-h" onclick="tog('cfg')"><div><div class="lbl" style="margin:0">Configuración</div><div style="font-size:12px;color:var(--text2)" id="cfg-sum">API key y Google Apps Script</div></div><span class="arrow" id="cfg-arrow">▼</span></div>
<div class="collapse" id="cfg"><div class="card-b">
<label>API Key de Gemini</label>
<div class="cfg-row"><input type="password" id="api-key" placeholder="Pega tu API key aqui..." oninput="saveKey()"><button class="btn" onclick="toggleVis()">Ver</button></div>
<div class="st" id="key-st">Obtén tu key en aistudio.google.com/apikey</div>
<label style="margin-top:10px">URL Google Apps Script (opcional)</label>
<div class="cfg-row"><input type="url" id="script-url" placeholder="https://script.google.com/macros/s/.../exec" oninput="saveUrl()"></div>
<div class="st" id="url-st"></div>
</div></div></div>
<div class="card"><div class="card-h" onclick="tog('datos')"><div><div class="lbl" style="margin:0">Datos de la consulta</div><div style="font-size:12px;color:var(--text2)">Diagnóstico, tipo, medicamentos</div></div><span class="arrow" id="datos-arrow">▼</span></div>
<div class="collapse" id="datos"><div class="card-b"><div class="grid">
<div class="fg"><label>Diagnóstico</label><input id="dx" placeholder="Ej: DELIRIUM, DEPRESIÓN..."></div>
<div class="fg"><label>Tipo IC</label><select id="tipo_ic"><option value="RESPUESTA A INTERCONSULTA POR PSIQUIATRIA">IC psiquiatría</option><option value="INTERCONSULTA POR PSIQUIATRIA (urgente)">IC urgente</option><option value="CONTROL AMBULATORIO">Control ambulatorio</option></select></div>
<div class="fg"><label>Valoración con</label><input id="val_con" placeholder="Ej: su madre - CAROLINA"></div>
<div class="fg"><label>Medicamentos</label><input id="meds" placeholder="Ej: Quetiapina 25mg (0-0-1)"></div>
<div class="fg f"><label>Contexto hospitalario</label><input id="ctx" placeholder="Ej: en manejo por estenosis traqueal..."></div>
</div></div></div></div>
<div class="card">
<div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between"><div class="lbl" style="margin:0">Relato del paciente</div><div style="display:flex;align-items:center;gap:8px"><span style="font-family:'DM Mono';font-size:12px;color:var(--text2)" id="timer"></span><span class="badge badge-a" id="rec-badge">Listo</span></div></div>
<div class="card-b">
<textarea id="transcript" class="ta-voice" placeholder="Graba la voz o escribe el relato..." oninput="onInput()"></textarea>
<div class="pipe" id="pipe" style="display:none"><span class="pd pd-ok" id="p1"></span><span>Audio</span><span style="color:var(--border)">›</span><span class="pd" id="p2"></span><span>Historia</span><span style="color:var(--border)">›</span><span class="pd" id="p3"></span><span>Doc</span></div>
<div class="row">
<button class="btn" id="btn-rec" onclick="toggleRec()"><span class="dot"></span> Grabar voz</button>
<button class="btn btn-p" id="btn-fin" onclick="finYCrear()" style="display:none">Finalizar y crear historia ↗</button>
<button class="btn" id="btn-solo" onclick="soloHist()" style="display:none">Solo historia</button>
<button class="btn" onclick="limpiar()" style="margin-left:auto">Limpiar</button>
</div>
<div class="st" id="st">Graba el relato y al finalizar se genera la historia.</div>
<div id="doc-area"></div>
</div></div>
<div class="card">
<div class="tabs"><button class="tab on" id="t1" onclick="tabSw('hist')">Historia generada</button><button class="tab" id="t2" onclick="tabSw('camp')">Campos</button></div>
<div id="tab-hist" class="card-b" style="padding-top:12px">
<textarea id="hist-out" class="ta-hist" placeholder="La historia clínica aparecerá aquí..."></textarea>
<div class="row"><button class="btn btn-p" onclick="copiar()">Copiar</button><button class="btn" id="btn-doc" onclick="enviarDoc()" style="display:none">Guardar en Drive ↗</button></div>
<div class="st" id="st-exp"></div>
</div>
<div id="tab-camp" class="card-b" style="display:none;padding-top:12px"><div class="grid">
<div class="fg"><label>Nombre</label><input id="c_nom"></div><div class="fg"><label>Edad</label><input id="c_edad"></div>
<div class="fg"><label>Origen</label><input id="c_orig"></div><div class="fg"><label>Residencia</label><input id="c_res"></div>
<div class="fg"><label>Ocupación</label><input id="c_ocup"></div><div class="fg f"><label>Familia</label><input id="c_fam"></div>
<div class="fg f"><label>Antecedentes</label><textarea id="c_ant" style="min-height:50px"></textarea></div>
<div class="fg f"><label>Cuadro clínico</label><textarea id="c_cuad" style="min-height:50px"></textarea></div>
<div class="fg f"><label>Examen mental</label><textarea id="c_exam" style="min-height:50px"></textarea></div>
<div class="fg f"><label>Plan</label><textarea id="c_plan" style="min-height:50px"></textarea></div>
</div></div>
</div></div>
<script>
const KEY_K='ic_key2',URL_K='ic_url2';
let recog=null,recOn=false,recInt=null,recSec=0;

const PROMPT=`Eres una psiquiatra colombiana. Organizas lo que te dictan en historia clinica profesional imitando este estilo. NUNCA uses comillas en el texto.

EJEMPLO:
RESPUESTA A INTERCONSULTA POR PSIQUIATRIA
Paciente femenina de 23 anos, natural de cartagena, residente y procedente de Bogota DC, es bachiller, actualmente labora en restaurante. Vive con su hija de 5 anos. Actualmente se encuentra en manejo por estenosis traqueal.

Paciente con antecedente de T. depresivo, con requerimiento de hospitalizacion en 2 ocasiones en Health and life, la ultima en febrero de 2026 por intoxicacion exogena con quetiapina (30 tabletas de 100mg). Se habia indicado manejo con Sertralina 100 mg y quetiapina 100 mg tab (0-0-1), sin embargo, por dificultad en los controles, no ha sido adherente con regularidad al manejo.

Refiere que actualmente presenta modulacion afectiva, sin episodios de panicos, sin ideacion de muerte o de suicidio. Tiene alteracion en el patron del sueno, aunque en manejo con quetiapina, logra continuarlo.
Niega sintomas psicoticos, maniformes, ideas de auto o heteroagresion. Niega ideas de muerte o de suicidio.

EXAMEN MENTAL:
Se encuentra a la paciente en su habitacion, en compania de su madre. Con adecuada higiene y acorde al contexto hospitalario, alerta, contactado con el entorno, orientado en tres esferas, euprosexica, eulalico, euquinetico, con afecto modulado, resonante y congruente con el discurso. Pensamiento logico, coherente, con ideas sobrevaloradas de preocupacion por retornar a su trabajo. Niega ideas de muerte, de suicidio o de autoagresion. No verbaliza ideacion delirante. No impresiona actitud alucinatoria. inteligencia impresiona, juicio y raciocinio conservado, introspeccion parcial, prospeccion hacia la mejoria.

ANALISIS:
Paciente femenina de 23 anos, actualmente en manejo por estenosis traqueal. Paciente con antecedente de T. depresivo; actualmente con remision de sus sintomas afectivos. Actualmente con mejoria en su funcionalidad. No ha presentado conductas de alto riesgo. En el momento considero reiniciar manejo farmacologico y continuar manejo de forma ambulatoria con control en 15 dias. Se resuelven dudas y se cierra IC.

PLAN:
Se cierra IC por psiquiatria
Sertralina 50 mg tab (1-0-0)
Quetiapina 25 mg tab (0-0-2)
Control ambulatorio por psiquiatria en 15 dias
Control ambulatorio por psicologia- Semanal.
Recomendaciones y signos de alarma para consultar.

TU TRABAJO:
1. ORGANIZAR lo que te dictan en historia clinica con este formato. Parrafos clinicos fluidos.
2. EXAMEN MENTAL: Construyelo tu con vocabulario clinico (euprosexica, eulalico, euquinetico, afecto, introspeccion, prospeccion).
3. ANALISIS: Redactalo tu con razonamiento clinico.
4. PLAN: Transcribelo EXACTAMENTE como te lo dictan. NO cambies medicamentos, dosis ni conducta. Si dicen salida es salida, si dicen hospitalizacion es hospitalizacion.
5. NUNCA uses comillas. Verbalizaciones con Refiere: sin comillas.
6. Negaciones al final del cuadro clinico.
7. *** para datos que falten.
8. RESPONDE SOLO CON LA HISTORIA CLINICA COMPLETA. Sin explicaciones, sin backticks, sin texto adicional antes o despues.`;

async function callAI(sys,usr){
  const k=localStorage.getItem(KEY_K);
  if(!k)throw new Error('Configura tu API key en configuracion.');
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+k,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:[{parts:[{text:usr}]}],generationConfig:{maxOutputTokens:2048,temperature:0.15}})
  });
  const d=await r.json();
  if(!r.ok)throw new Error(d.error?d.error.message:JSON.stringify(d));
  if(!d.candidates||!d.candidates[0])throw new Error('Sin respuesta de Gemini.');
  return d.candidates[0].content.parts[0].text.trim();
}

window.addEventListener('load',()=>{
  const k=localStorage.getItem(KEY_K);if(k){document.getElementById('api-key').value=k;setKeyOk();}else tog('cfg');
  const u=localStorage.getItem(URL_K);if(u)document.getElementById('script-url').value=u;
});
function saveKey(){const k=document.getElementById('api-key').value.trim();if(k.length>10){localStorage.setItem(KEY_K,k);setKeyOk();}}
function setKeyOk(){document.getElementById('key-st').textContent='Key guardada.';document.getElementById('key-st').className='st st-ok';document.getElementById('hdr-badge').textContent='Lista';document.getElementById('hdr-badge').className='badge badge-g';document.getElementById('cfg-sum').textContent='Configurada ✓';}
function saveUrl(){const u=document.getElementById('script-url').value.trim();if(u.startsWith('https://'))localStorage.setItem(URL_K,u);}
function toggleVis(){const i=document.getElementById('api-key');i.type=i.type==='password'?'text':'password';}
function tog(id){document.getElementById(id).classList.toggle('open');}

function toggleRec(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){setSt('Usa Chrome.','st-err');return;}recOn?stopRec():startRec();}
function startRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recog=new SR();recog.continuous=true;recog.interimResults=true;recog.lang='es-CO';
  let fin=document.getElementById('transcript').value;
  recog.onstart=()=>{recOn=true;recSec=0;document.getElementById('btn-rec').className='btn btn-rec';document.getElementById('btn-rec').innerHTML='<span class="dot"></span> Pausar';document.getElementById('rec-badge').className='badge badge-r';document.getElementById('rec-badge').textContent='Grabando';recInt=setInterval(()=>{recSec++;document.getElementById('timer').textContent=String(Math.floor(recSec/60)).padStart(2,'0')+':'+String(recSec%60).padStart(2,'0');},1000);setSt('Escuchando...','st-load');};
  recog.onresult=e=>{let int='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';else int+=e.results[i][0].transcript;}const ta=document.getElementById('transcript');ta.value=fin+int;ta.scrollTop=ta.scrollHeight;};
  recog.onerror=e=>{setSt('Error: '+e.error,'st-err');stopRec();};recog.onend=()=>{if(recOn)stopRec();};recog.start();
}
function stopRec(){recOn=false;if(recog)recog.stop();clearInterval(recInt);document.getElementById('btn-rec').className='btn';document.getElementById('btn-rec').innerHTML='<span class="dot"></span> Grabar voz';document.getElementById('rec-badge').className='badge badge-g';document.getElementById('rec-badge').textContent='Listo ✓';document.getElementById('timer').textContent='';showB();setSt('Pausada. Graba mas o finaliza.','st-ok');}
function onInput(){document.getElementById('transcript').value.trim().length>0?showB():hideB();}
function showB(){document.getElementById('btn-fin').style.display='';document.getElementById('btn-solo').style.display='';}
function hideB(){document.getElementById('btn-fin').style.display='none';document.getElementById('btn-solo').style.display='none';}

function getCtx(){let x='';const d=document.getElementById('dx').value,t=document.getElementById('tipo_ic').value,v=document.getElementById('val_con').value,m=document.getElementById('meds').value,c=document.getElementById('ctx').value;if(d)x+='\nDIAGNOSTICO: '+d;if(t)x+='\nTIPO: '+t;if(v)x+='\nVALORACION CON: '+v;if(c)x+='\nCONTEXTO: '+c;if(m)x+='\nMEDICAMENTOS PLAN: '+m;return x;}

async function finYCrear(){hideB();const h=await gen();if(!h)return;const u=localStorage.getItem(URL_K);if(u)await crearDoc(h);else{setSt('Historia lista. Configura Apps Script para Drive.','st-ok');document.getElementById('btn-doc').style.display='';}}
async function soloHist(){hideB();await gen();}

async function gen(){
  const txt=document.getElementById('transcript').value.trim();
  if(!txt){setSt('Primero graba o escribe.','st-err');return null;}
  document.getElementById('hist-out').value='';document.getElementById('doc-area').innerHTML='';document.getElementById('btn-doc').style.display='none';
  setPipe(1,'pd-ok');setPipe(2,'pd-on');setPipe(3,'');setSt('Generando historia clinica...','st-load');
  const msg='DICTADO:\n'+txt+getCtx()+'\n\nOrganiza en historia clinica completa con EXAMEN MENTAL, ANALISIS y PLAN. El PLAN exactamente como te lo dicte.';
  try{const h=await callAI(PROMPT,msg);document.getElementById('hist-out').value=h;setPipe(2,'pd-ok');setSt('Historia generada.','st-ok');document.getElementById('btn-doc').style.display='';return h;}
  catch(e){setPipe(2,'pd-err');setSt('Error: '+e.message,'st-err');return null;}
}

async function enviarDoc(){const h=document.getElementById('hist-out').value.trim();if(!h)return;const u=localStorage.getItem(URL_K);if(!u){setSt('Configura Apps Script.','st-err');return;}setSt('Creando Doc...','st-load');await crearDoc(h);}
async function crearDoc(h){
  const u=localStorage.getItem(URL_K);
  try{await fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:'***',diagnostico:document.getElementById('dx').value||'IC',tipo_ic:document.getElementById('tipo_ic').value,historia:h})});
  setPipe(3,'pd-ok');setSt('Doc enviado a Drive.','st-ok');document.getElementById('doc-area').innerHTML='<a class="doc-link" href="https://drive.google.com/drive/folders/1Ql2IimpT-4nrOxFfLFw6E0g5nfqzKaCG" target="_blank">Abrir carpeta en Drive →</a>';document.getElementById('btn-doc').style.display='none';}
  catch(e){setPipe(3,'pd-err');setSt('Error Doc: '+e.message,'st-err');}
}

function setPipe(n,c){document.getElementById('pipe').style.display='flex';document.getElementById('p'+n).className='pd '+c;}
function setSt(m,c){const e=document.getElementById('st');e.textContent=m;e.className='st '+(c||'');}
function tabSw(t){document.getElementById('t1').className='tab'+(t==='hist'?' on':'');document.getElementById('t2').className='tab'+(t==='camp'?' on':'');document.getElementById('tab-hist').style.display=t==='hist'?'':'none';document.getElementById('tab-camp').style.display=t==='camp'?'':'none';}
function copiar(){const h=document.getElementById('hist-out').value;if(!h)return;navigator.clipboard.writeText(h).then(()=>{document.getElementById('st-exp').textContent='Copiada.';document.getElementById('st-exp').className='st st-ok';});}
function limpiar(){['transcript','hist-out','c_nom','c_edad','c_orig','c_res','c_ocup','c_fam','c_ant','c_cuad','c_exam','c_plan','dx','val_con','meds','ctx'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});document.getElementById('tipo_ic').selectedIndex=0;document.getElementById('doc-area').innerHTML='';document.getElementById('pipe').style.display='none';document.getElementById('btn-doc').style.display='none';hideB();document.getElementById('rec-badge').className='badge badge-a';document.getElementById('rec-badge').textContent='Listo';document.getElementById('timer').textContent='';setSt('Listo.','');document.getElementById('st-exp').textContent='';}
</script>
</body>
</html>
